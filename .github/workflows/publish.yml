name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: Expand-Archive -Path EduPlatform_somee.zip -DestinationPath extracted
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Install .NET 4.6.1
        run: choco install netfx-4.6.1-devpack -y
      - name: Build
        run: |
          $proj = (Get-ChildItem -Path extracted -Recurse -Filter *.sln | Select-Object -First 1).FullName
          echo Found $proj
          msbuild $proj /p:Configuration=Release
      - name: Upload bin
        uses: actions/upload-artifact@v4
        with:
          name: publish-bin
          path: extracted/**/bin/**
